name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create or update
        required: true
        default: v0.1.2

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require NGC credential
        shell: pwsh
        env:
          NGC_API_KEY: ${{ secrets.NGC_CLI_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGC_API_KEY)) {
            throw "Repository secret NGC_CLI_API_KEY is required for release builds."
          }

      - name: Download NVIDIA AFX SDK 2.1.0
        shell: pwsh
        env:
          NGC_API_KEY: ${{ secrets.NGC_CLI_API_KEY }}
        run: |
          $resourceUri = "https://api.ngc.nvidia.com/v2/org/nvidia/team/maxine/resources/maxine_windows_audio_effects_sdk/versions/2.1.0"
          $headers = @{
            Authorization = "Bearer $env:NGC_API_KEY"
            Accept = "application/json"
          }
          $listing = Invoke-RestMethod `
            -Uri "$resourceUri/files" `
            -Method Get `
            -Headers $headers
          $archive = @($listing.recipeFiles) |
            Where-Object { $_.path -like "*.zip" } |
            Select-Object -First 1
          if (-not $archive) {
            throw "The NGC SDK resource did not list a ZIP archive."
          }

          $archiveName = [Uri]::EscapeDataString([string]$archive.path)
          curl.exe -fL `
            -H "Authorization: Bearer $env:NGC_API_KEY" `
            -o afx-sdk-resource.zip `
            "$resourceUri/files/$archiveName"
          if ($LASTEXITCODE -ne 0) {
            throw "The NGC SDK archive download failed."
          }
          $actualHash = (Get-FileHash `
            -LiteralPath afx-sdk-resource.zip `
            -Algorithm SHA256).Hash
          $actualHashBase64 = [Convert]::ToBase64String(
            [Convert]::FromHexString($actualHash))
          if ($actualHashBase64 -ne [string]$archive.sha256_base64) {
            throw "The NGC SDK archive failed SHA-256 verification."
          }
          Expand-Archive -LiteralPath afx-sdk-resource.zip -DestinationPath afx-sdk-resource

          $header = Get-ChildItem -LiteralPath afx-sdk-resource -Recurse -File `
            -Filter nvAudioEffects.h | Select-Object -First 1
          if (-not $header) {
            $index = 0
            Get-ChildItem -LiteralPath afx-sdk-resource -Recurse -File -Filter *.zip |
              ForEach-Object {
                $destination = Join-Path $PWD "afx-sdk-expanded-$index"
                Expand-Archive -LiteralPath $_.FullName -DestinationPath $destination
                $script:index++
              }
            $header = Get-ChildItem -Path "$PWD/afx-sdk-expanded-*" -Recurse -File `
              -Filter nvAudioEffects.h | Select-Object -First 1
          }
          if (-not $header) { throw "nvAudioEffects.h was not found in the NGC resource." }
          $sdkRoot = Split-Path -Parent (Split-Path -Parent $header.FullName)
          "AFX_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download NVIDIA Noise Removal feature
        shell: pwsh
        env:
          NGC_CLI_API_KEY: ${{ secrets.NGC_CLI_API_KEY }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:NGC_CLI_API_KEY"
            Accept = "application/json"
          }
          $modelRoot = Join-Path $env:AFX_SDK_ROOT `
            "features/nvafxdenoiser/models/blackwell"
          $runtimeRoot = Join-Path $env:AFX_SDK_ROOT `
            "features/nvafxdenoiser/bin"
          $downloads = @(
            @{
              Variant = "2.1.0-48k-blackwell"
              Names = @("denoiser_48k.trtpkg", "denoiser_48k.trtpkg.md5")
              Destination = $modelRoot
            },
            @{
              Variant = "2.1.0-dynamic-library"
              Names = @("nvafxdenoiser.dll", "nvafxdenoiser.dll.md5")
              Destination = $runtimeRoot
            }
          )
          $modelUri = "https://api.ngc.nvidia.com/v2/org/nvidia/team/maxine/models/afx_win_denoiser"
          foreach ($download in $downloads) {
            New-Item -ItemType Directory `
              -Path $download.Destination `
              -Force | Out-Null
            $listing = Invoke-RestMethod `
              -Uri "$modelUri/$($download.Variant)/files" `
              -Method Get `
              -Headers $headers
            for ($index = 0; $index -lt @($listing.filepath).Count; $index++) {
              $name = [string]$listing.filepath[$index]
              if ($download.Names -notcontains $name) { continue }
              Invoke-WebRequest `
                -Uri ([string]$listing.urls[$index]) `
                -OutFile (Join-Path $download.Destination $name)
            }
          }

          $model = Join-Path $env:AFX_SDK_ROOT `
            "features/nvafxdenoiser/models/blackwell/denoiser_48k.trtpkg"
          $runtime = Join-Path $env:AFX_SDK_ROOT `
            "features/nvafxdenoiser/bin/nvafxdenoiser.dll"
          foreach ($file in @($model, $runtime)) {
            $checksum = "$file.md5"
            if (-not (Test-Path -LiteralPath $file) -or
                -not (Test-Path -LiteralPath $checksum)) {
              throw "A required Noise Removal file was not downloaded."
            }
            $expected = (Get-Content -LiteralPath $checksum -Raw).Trim()
            $actual = (Get-FileHash -LiteralPath $file -Algorithm MD5).Hash
            if ($actual -ine $expected) {
              throw "A Noise Removal file failed MD5 verification."
            }
          }

      - name: Configure self-contained release
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DAFX_SDK_ROOT="$env:AFX_SDK_ROOT" `
            -DECHONULL_BUILD_TESTS=ON `
            -DECHONULL_EMBED_NVAFX=ON `
            -DECHONULL_NVAFX_ARCHITECTURE=blackwell

      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
          if (-not (Test-Path -LiteralPath EchoNullPlugin.dll)) {
            throw "Self-contained EchoNullPlugin.dll was not produced."
          }

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath EchoNullPlugin.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *EchoNullPlugin.dll" | Set-Content -LiteralPath EchoNullPlugin.dll.sha256 -NoNewline

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: EchoNull ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            EchoNullPlugin.dll
            EchoNullPlugin.dll.sha256
